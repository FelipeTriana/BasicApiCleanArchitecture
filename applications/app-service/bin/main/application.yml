spring:
  application:
    name: CleanArchitecture

  datasource:
    url: jdbc:postgresql://localhost:5432/cleanexample
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
app:
  context: /api
  #SELF_APP_CONFIGURATION_OPT

jwt:
  # Must be at least 32 characters (256 bits) for HS256.
  # In production, inject via environment variable: JWT_SECRET
  secret: ${JWT_SECRET:ChangeThisSecretInProductionMustBe32Chars!!}
  expiration-seconds: 86400   # 24 hours

